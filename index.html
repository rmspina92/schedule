<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#18181b" />
<title>Minha agenda de turnos</title>
<style>
  :root {
    --bg:#ffffff; --fg:#18181b; --muted:#71717a; --border:#e4e4e7; --card:#f4f4f5;
    --primary:#18181b; --primary-fg:#ffffff;
    --c9a:#fbcfe8; --c12a:#bbf7d0; --cT:#e879f9; --cH:#fde047; --cO:#bfdbfe;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#09090b; --fg:#fafafa; --muted:#a1a1aa; --border:#27272a; --card:#18181b;
      --primary:#fafafa; --primary-fg:#18181b; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font-size:16px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom); }
  button,textarea { font:inherit; color:inherit; }
  button { cursor:pointer; border:1px solid var(--border); background:var(--bg); border-radius:10px; min-height:44px; padding:0 14px; }
  button:active { background:var(--card); }
  button:focus-visible,summary:focus-visible,textarea:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  .hidden { display:none !important; }
  .wrap { max-width:520px; margin:0 auto; padding:12px 12px 32px; }

  /* topo */
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .top h1 { font-size:18px; margin:0; font-weight:700; }
  .menu { position:relative; }
  .menu summary { list-style:none; cursor:pointer; border:1px solid var(--border); border-radius:10px;
    min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .menu summary::-webkit-details-marker { display:none; }
  .menu .panel { position:absolute; right:0; top:50px; z-index:20; background:var(--bg); border:1px solid var(--border);
    border-radius:12px; padding:6px; min-width:200px; box-shadow:0 8px 24px rgba(0,0,0,.18); display:flex; flex-direction:column; gap:2px; }
  .menu .panel button { border:0; text-align:left; width:100%; }
  .menu .panel .danger { color:#dc2626; }

  /* alternar semana / mês */
  .seg { display:grid; grid-template-columns:1fr 1fr; background:var(--card); border-radius:12px; padding:4px; margin-bottom:12px; }
  .seg button { border:0; background:transparent; border-radius:9px; font-weight:600; color:var(--muted); }
  .seg button[aria-pressed="true"] { background:var(--primary); color:var(--primary-fg); }

  /* navegação */
  .nav { display:grid; grid-template-columns:48px 1fr 48px; align-items:center; margin-bottom:10px; }
  .nav button { padding:0; font-size:20px; }
  .nav strong { text-align:center; font-size:17px; text-transform:capitalize; }
  .today-btn { display:block; margin:-2px auto 10px; border:0; background:none; color:var(--muted); font-size:14px; min-height:32px; text-decoration:underline; }

  /* semana: lista vertical */
  .week { display:flex; flex-direction:column; gap:8px; }
  .wrow { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;
    min-height:68px; padding:10px 14px; border-radius:14px; text-align:left; }
  .wrow.today { border:2px solid var(--fg); }
  .wdate { display:flex; align-items:baseline; gap:10px; }
  .wnum { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; min-width:36px; }
  .wname { font-size:15px; color:var(--muted); text-transform:capitalize; }
  .wpill { border-radius:10px; padding:8px 14px; font-weight:700; font-size:17px; color:#18181b; text-align:center; min-width:84px; }
  .wpill small { display:block; font-weight:500; font-size:12px; opacity:.8; }

  /* mês: grade que cabe na largura */
  .dows,.month { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
  .dows div { text-align:center; font-size:12px; font-weight:600; color:var(--muted); padding-bottom:4px; }
  .mcell { aspect-ratio:1/1.15; padding:0; border-radius:8px; min-height:0; position:relative;
    display:flex; align-items:center; justify-content:center; }
  .mcell .n { position:absolute; top:3px; left:0; right:0; text-align:center; font-size:12px; line-height:1; color:var(--muted); font-variant-numeric:tabular-nums; }
  .mcell .k { font-size:13px; font-weight:700; border-radius:6px; width:calc(100% - 6px); text-align:center; padding:5px 0; margin-top:8px; color:#18181b; }
  .mcell.out { visibility:hidden; }
  .mcell.today { border:2px solid var(--fg); }
  .mcell.today .n { font-weight:800; color:var(--fg); }

  .legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:14px; font-size:13px; color:var(--muted); justify-content:center; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:4px; vertical-align:-1px; }

  /* importar */
  .card { border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:15px; margin:0 0 6px; }
  .muted { color:var(--muted); font-size:13px; margin:0 0 8px; }
  textarea { width:100%; min-height:130px; border:1px solid var(--border); border-radius:10px; padding:10px; background:var(--bg);
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; }
  .row { display:flex; gap:8px; margin-top:10px; }
  .row button { flex:1; }
  .primary { background:var(--primary); color:var(--primary-fg); border-color:var(--primary); font-weight:600; }
  .err { color:#dc2626; font-size:13px; margin-top:8px; }

  /* folha para escolher o turno */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:31; background:var(--bg); border-radius:18px 18px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; box-shadow:0 -8px 30px rgba(0,0,0,.25); }
  .sheet h2 { font-size:17px; margin:0 0 2px; text-transform:capitalize; }
  .chips { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; margin:14px 0 10px; }
  .custom { display:flex; gap:8px; margin-bottom:10px; }
  .custom input { flex:1; min-width:0; min-height:44px; border:1px solid var(--border); border-radius:10px; padding:0 12px; background:var(--bg); color:var(--fg); font:inherit; }
  .chip { min-height:56px; padding:0; border:2px solid transparent; font-weight:700; font-size:17px; color:#18181b; border-radius:12px; }
  .chip.on { border-color:var(--fg); }
  .sheet .close { width:100%; }
  @media (prefers-reduced-motion:no-preference) { .sheet { animation:up .18s ease-out; } @keyframes up { from { transform:translateY(24px); opacity:0 } } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Minha agenda</h1>
    <details class="menu" id="menu">
      <summary aria-label="Mais opções">&#8943;</summary>
      <div class="panel">
        <button id="btnImport">Importar lista</button>
        <button id="btnExport">Salvar backup</button>
        <button id="btnRestore">Restaurar backup</button>
        <button id="btnClear" class="danger">Apagar tudo</button>
      </div>
    </details>
    <input type="file" id="restoreFile" accept="application/json,.json" class="hidden" aria-label="Arquivo de backup" />
  </div>

  <section id="importBox" class="card hidden" aria-labelledby="importTitle">
    <h2 id="importTitle">Importar lista</h2>
    <p class="muted">Cole os dias no formato <b>DD/MM/AAAA: código</b>. Códigos: 9a, 12a, T, H, O.</p>
    <textarea id="importText" placeholder="16/11/2026: 9a&#10;17/11/2026: T" aria-label="Lista de turnos"></textarea>
    <div class="row">
      <button id="btnCancelImport">Cancelar</button>
      <button id="btnDoImport" class="primary">Importar</button>
    </div>
    <div id="importMsg" class="err" role="alert"></div>
  </section>

  <div class="seg" role="group" aria-label="Tipo de visão">
    <button id="modeWeek" aria-pressed="true">Semana</button>
    <button id="modeMonth" aria-pressed="false">Mês</button>
  </div>

  <div class="nav">
    <button id="prev" aria-label="Anterior">&#8249;</button>
    <strong id="title"></strong>
    <button id="next" aria-label="Próximo">&#8250;</button>
  </div>
  <button id="todayBtn" class="today-btn hidden">Voltar para hoje</button>

  <div id="weekView" class="week"></div>
  <div id="monthView" class="hidden">
    <div class="dows" id="dows"></div>
    <div class="month" id="month"></div>
  </div>

  <div class="legend" id="legend"></div>
</div>

<div id="overlay" class="overlay hidden"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle"></h2>
  <p class="muted" id="sheetInfo"></p>
  <div class="chips" id="chips"></div>
  <div class="custom">
    <input id="customCode" maxlength="8" autocapitalize="characters" autocomplete="off" placeholder="Outro código (ex.: BH, 11a)" aria-label="Outro código" />
    <button id="customUse" class="primary">Usar</button>
  </div>
  <div id="customErr" class="err" role="alert"></div>
  <button id="sheetClose" class="close">Fechar</button>
</div>

<script>
(function () {
  var KEY = "minha-agenda-de-turnos-v1";
  var PRESETS = ["9a","12a","11a","T","H","BH","O"];
  var PRESET_COLOR = { "9a":"#fbcfe8", "12a":"#bbf7d0", "11a":"#fdba74", T:"#e879f9", H:"#fde047", BH:"#a3e635", O:"#bfdbfe", PL:"#f87171", "9-1":"#f0abfc", C:"#fed7aa" };
  var PALETTE = ["#fca5a5","#fdba74","#fcd34d","#bef264","#6ee7b7","#67e8f9","#a5b4fc","#d8b4fe","#f9a8d4","#cbd5e1"];
  var NAMES = { T:"Training", H:"Feriado", BH:"Bank holiday", O:"Off" };
  var TIMES = { T:"09:00–18:00" };
  function colorOf(c){
    if (PRESET_COLOR[c]) return PRESET_COLOR[c];
    var h=0; for (var i=0;i<c.length;i++) h=(h*31+c.charCodeAt(i))>>>0;
    return PALETTE[h%PALETTE.length];
  }
  function nameOf(c){ return NAMES[c] || c; }
  function timeOf(c){
    if (TIMES[c]) return TIMES[c];
    var m=/^(\d{1,2})a$/.exec(c);
    return m ? String(m[1]).padStart(2,"0")+":00" : null;
  }
  // códigos conhecidos + qualquer código novo que apareça nos dados
  function allCodes(){
    var extra={}; Object.keys(data).forEach(function(k){ var c=data[k]; if (PRESETS.indexOf(c)===-1) extra[c]=1; });
    var list=Object.keys(extra).sort();
    var head=PRESETS.slice(0,-1);          // O (Off) vai por último
    return head.concat(list, ["O"]);
  }
  var DOW_FULL = ["segunda","terça","quarta","quinta","sexta","sábado","domingo"];
  var DOW_SHORT = ["S","T","Q","Q","S","S","D"];
  var MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var MON_SHORT = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

  var data = load();
  var mode = "week";
  var anchor = new Date();           // dia de referência para semana/mês
  var selected = null;

  function pad(n){ return String(n).padStart(2,"0"); }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function addD(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
  function mondayOf(d){ return addD(d, -((d.getDay()+6)%7)); }
  function parseKey(k){ var p=k.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} }
  function codeOf(key){ return data[key] || "O"; }
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- importar ---------- */
  function isRealDate(y,m,d){ var x=new Date(y,m-1,d); return x.getFullYear()===y && x.getMonth()===m-1 && x.getDate()===d; }
  function normalizeCode(raw){
    var t = raw.replace(/^[-\u2013\u2014:=]\s*(?=\S)/,"").toLowerCase().replace(/\s+/g,"");
    if (t==="-"||t==="") return "";
    if (/^(t|t9-6|training|training9-6|treino|treino9-6)$/.test(t)) return "T";
    if (/^(h|holiday|feriado)$/.test(t)) return "H";
    if (/^(o|off|folga)$/.test(t)) return "O";
    if (/^(bh|bankholiday)$/.test(t)) return "BH";
    if (/^\d{1,2}a$/.test(t)) return t;              // 9a, 11a, 12a, ...
    if (/^\d{1,2}-\d{1,2}$/.test(t)) return t;      // 9-1
    if (/^[a-z]{1,3}$/.test(t)) return t.toUpperCase(); // BH, PL, C, ...
    return null;
  }
  function parseImport(text){
    var out={}, invalid=[];
    var SPLIT=/(?<![\d\/.\-])(?=\d{4}-\d{2}-\d{2}\s*[:=;,\t\s]|\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{4}\s*[:=;,\t\s])/;
    var ONE=/^\s*(\d{4}-\d{2}-\d{2}|\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{4})\s*(?:[:=;,\t]|\s)\s*(.*?)\s*$/;
    text.split(/\r?\n/).forEach(function(line){
      if(!line.trim()) return;
      line.split(SPLIT).forEach(function(piece){
        if(!piece.trim()) return;
        var m=ONE.exec(piece), code=m?normalizeCode(m[2]):null;
        if(!m||code===null){ invalid.push(piece.trim().slice(0,60)); return; }
        var y,mo,d,raw=m[1];
        if(/^\d{4}/.test(raw)){ var p=raw.split("-").map(Number); y=p[0];mo=p[1];d=p[2]; }
        else { var q=raw.split(/[\/.\-]/).map(Number); d=q[0];mo=q[1];y=q[2]; }
        if(!isRealDate(y,mo,d)){ invalid.push(piece.trim().slice(0,60)); return; }
        out[y+"-"+pad(mo)+"-"+pad(d)] = code;
      });
    });
    return { entries:out, invalid:invalid };
  }

  /* ---------- desenho ---------- */
  function render(){
    var todayKey = iso(new Date());
    renderLegend();
    $("modeWeek").setAttribute("aria-pressed", mode==="week");
    $("modeMonth").setAttribute("aria-pressed", mode==="month");
    $("weekView").classList.toggle("hidden", mode!=="week");
    $("monthView").classList.toggle("hidden", mode!=="month");

    if (mode==="week") {
      var start = mondayOf(anchor), end = addD(start,6);
      $("title").textContent = start.getDate()+" "+MON_SHORT[start.getMonth()]+" – "+end.getDate()+" "+MON_SHORT[end.getMonth()];
      var html="";
      for (var i=0;i<7;i++){
        var d=addD(start,i), k=iso(d), c=codeOf(k);
        var time = timeOf(c) ? "<small>"+timeOf(c)+"</small>" : "";
        html += '<button class="wrow'+(k===todayKey?" today":"")+'" data-key="'+k+'" aria-label="'+DOW_FULL[i]+", "+d.getDate()+" de "+MONTHS[d.getMonth()]+", "+nameOf(c)+'">'
          + '<span class="wdate"><span class="wnum">'+d.getDate()+'</span><span class="wname">'+DOW_FULL[i]+'</span></span>'
          + '<span class="wpill" style="background:'+colorOf(c)+'">'+nameOf(c)+time+'</span></button>';
      }
      $("weekView").innerHTML = html;
      $("todayBtn").classList.toggle("hidden", iso(mondayOf(new Date()))===iso(start));
    } else {
      var first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
      $("title").textContent = MONTHS[first.getMonth()]+" "+first.getFullYear();
      $("dows").innerHTML = DOW_SHORT.map(function(x){ return "<div>"+x+"</div>"; }).join("");
      var lead=(first.getDay()+6)%7, days=new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
      var h="";
      for (var j=0;j<lead;j++) h+='<div class="mcell out"></div>';
      for (var n=1;n<=days;n++){
        var dd=new Date(first.getFullYear(), first.getMonth(), n), kk=iso(dd), cc=codeOf(kk);
        h += '<button class="mcell'+(kk===todayKey?" today":"")+'" data-key="'+kk+'" aria-label="'+n+" de "+MONTHS[dd.getMonth()]+", "+nameOf(cc)+'">'
          + '<span class="n">'+n+'</span><span class="k" style="background:'+colorOf(cc)+'">'+cc+'</span></button>';
      }
      $("month").innerHTML = h;
      var now=new Date();
      $("todayBtn").classList.toggle("hidden", now.getFullYear()===first.getFullYear() && now.getMonth()===first.getMonth());
    }
  }

  function renderLegend(){
    $("legend").innerHTML = allCodes().map(function(c){
      return '<span><i style="background:'+colorOf(c)+'"></i>'+(nameOf(c)===c?c:c+" "+nameOf(c))+"</span>";
    }).join("");
  }

  /* ---------- escolher turno ---------- */
  function openSheet(key){
    selected = key;
    var d=parseKey(key);
    $("sheetTitle").textContent = DOW_FULL[(d.getDay()+6)%7]+", "+d.getDate()+" de "+MONTHS[d.getMonth()];
    var cur=codeOf(key);
    $("sheetInfo").textContent = timeOf(cur) ? "Horário: "+timeOf(cur) : nameOf(cur);
    $("chips").innerHTML = allCodes().map(function(c){
      return '<button class="chip'+(c===cur?" on":"")+'" style="background:'+colorOf(c)+'" data-code="'+c+'" aria-label="'+nameOf(c)+'">'+c+"</button>";
    }).join("");
    $("customCode").value=""; $("customErr").textContent="";
    $("overlay").classList.remove("hidden");
    $("sheet").classList.remove("hidden");
  }
  function closeSheet(){
    selected=null;
    $("overlay").classList.add("hidden");
    $("sheet").classList.add("hidden");
  }
  $("chips").addEventListener("click", function(e){
    var b=e.target.closest("button[data-code]"); if(!b||!selected) return;
    var c=b.getAttribute("data-code");
    if (c==="O") delete data[selected]; else data[selected]=c;
    save(); closeSheet(); render();
  });
  function useCustom(){
    if(!selected) return;
    var c=normalizeCode($("customCode").value);
    if(c===null || c===""){ $("customErr").textContent="Código inválido. Exemplos: BH, 11a, 9-1, PL."; return; }
    if(c==="O") delete data[selected]; else data[selected]=c;
    save(); closeSheet(); render();
  }
  $("customUse").onclick = useCustom;
  $("customCode").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); useCustom(); } });
  $("sheetClose").onclick = closeSheet;
  $("overlay").onclick = closeSheet;
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet(); });

  function onDayClick(e){
    var b=e.target.closest("button[data-key]"); if(b) openSheet(b.getAttribute("data-key"));
  }
  $("weekView").addEventListener("click", onDayClick);
  $("month").addEventListener("click", onDayClick);

  /* ---------- navegação ---------- */
  $("modeWeek").onclick = function(){ mode="week"; render(); };
  $("modeMonth").onclick = function(){ mode="month"; render(); };
  $("prev").onclick = function(){
    anchor = mode==="week" ? addD(anchor,-7) : new Date(anchor.getFullYear(), anchor.getMonth()-1, 1);
    render();
  };
  $("next").onclick = function(){
    anchor = mode==="week" ? addD(anchor,7) : new Date(anchor.getFullYear(), anchor.getMonth()+1, 1);
    render();
  };
  $("todayBtn").onclick = function(){ anchor=new Date(); render(); };

  // deslizar para os lados troca de semana/mês
  var sx=null;
  document.addEventListener("touchstart", function(e){ sx = e.touches.length===1 ? e.touches[0].clientX : null; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if (sx===null || !$("sheet").classList.contains("hidden")) return;
    var dx = e.changedTouches[0].clientX - sx; sx=null;
    if (Math.abs(dx) > 70) { (dx<0 ? $("next") : $("prev")).click(); }
  }, {passive:true});

  /* ---------- menu ---------- */
  function closeMenu(){ $("menu").removeAttribute("open"); }
  $("btnImport").onclick = function(){ closeMenu(); $("importBox").classList.remove("hidden"); $("importMsg").textContent=""; $("importText").focus(); };
  $("btnCancelImport").onclick = function(){ $("importBox").classList.add("hidden"); };
  $("btnDoImport").onclick = function(){
    var res=parseImport($("importText").value), keys=Object.keys(res.entries);
    if(!keys.length){ $("importMsg").textContent="Nenhuma linha válida. Use o formato DD/MM/AAAA: código."; return; }
    keys.forEach(function(k){ if(res.entries[k] && res.entries[k]!=="O") data[k]=res.entries[k]; else delete data[k]; });
    save();
    $("importText").value=""; $("importBox").classList.add("hidden"); $("importMsg").textContent="";
    if(res.invalid.length) alert(keys.length+" dias importados. Linhas ignoradas: "+res.invalid.length);
    var first=keys.sort()[0]; anchor=parseKey(first);
    render();
  };
  $("btnClear").onclick = function(){
    closeMenu();
    if(confirm("Apagar todos os turnos salvos neste aparelho?")){ data={}; save(); render(); }
  };
  $("btnExport").onclick = function(){
    closeMenu();
    var payload={ app:"minha-agenda-de-turnos", version:1, savedAt:new Date().toISOString(), days:data };
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="backup-agenda-turnos-"+iso(new Date())+".json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1000);
  };
  $("btnRestore").onclick = function(){ closeMenu(); $("restoreFile").click(); };
  $("restoreFile").onchange = function(e){
    var file=e.target.files && e.target.files[0]; e.target.value=""; if(!file) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var obj=JSON.parse(r.result);
        var days=obj && obj.app==="minha-agenda-de-turnos" && obj.days ? obj.days : null;
        if(!days) throw new Error("formato");
        var clean={}, n=0;
        Object.keys(days).forEach(function(k){ if(/^\d{4}-\d{2}-\d{2}$/.test(k) && normalizeCode(String(days[k]))===days[k] && days[k]!=="O" && days[k]!==""){ clean[k]=days[k]; n++; } });
        if(!confirm("Restaurar o backup substitui os turnos atuais por "+n+" dias do arquivo. Continuar?")) return;
        data=clean; save(); render();
      }catch(err){ alert("Este arquivo não é um backup válido desta agenda."); }
    };
    r.readAsText(file);
  };
  document.addEventListener("click", function(e){ if(!e.target.closest("#menu")) closeMenu(); });

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});

  renderLegend();
  render();
})();
</script>
</body>
